; Alembic configuration for verbio-engine.
;
; The migrations themselves live at infra/postgres/migrations/ per the
; engineering brief (§12: "infra/postgres/migrations/ — Alembic
; migrations (source of truth)"). alembic.ini stays here in
; services/engine/ so `uv run alembic ...` works without -c flags.
;
; Connection URL is sourced from $DATABASE_URL_DIRECT at runtime; do
; not put credentials in this file. env.py reads it.

[alembic]
script_location = %(here)s/../../infra/postgres/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 50

[post_write_hooks]
hooks = ruff_check
ruff_check.type = console_scripts
ruff_check.entrypoint = ruff
ruff_check.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
