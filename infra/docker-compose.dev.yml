# Local development substrate for Verbio.
#
# Mirrors the Railway-managed production stack closely enough that
# `pnpm dev` and `uv run verbio-engine` work end-to-end on a laptop:
# Postgres 16 (with pgBouncer in transaction mode for parity with
# Railway's pooled URL), Redis 7, and a pgAdmin tab for debugging.
#
# Run:
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# Credentials are intentionally weak — this stack is local-only and
# must never be exposed beyond localhost.

name: verbio-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: verbio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verbio
      POSTGRES_PASSWORD: verbio
      POSTGRES_DB: verbio
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGUSER: verbio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verbio -d verbio"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: verbio-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: verbio
      DB_PASSWORD: verbio
      DB_HOST: postgres
      DB_NAME: verbio
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6543:5432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5432"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verbio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: verbio-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@verbio.local
      PGADMIN_DEFAULT_PASSWORD: verbio
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    profiles: ["debug"]

volumes:
  postgres-data:
    name: verbio-postgres-data
  redis-data:
    name: verbio-redis-data
