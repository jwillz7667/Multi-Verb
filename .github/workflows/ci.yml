name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  checks: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  PYTHON_VERSION: "3.12"
  TURBO_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  # =========================================================================
  # Web — Next.js + TypeScript + shared packages
  # =========================================================================
  web:
    name: web · lint • typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        env:
          # Build-only escape hatch: env.ts validates at module init,
          # and `next build` imports every route handler (including
          # auth) to collect page data. Skipping validation here keeps
          # the build green without weakening runtime guarantees.
          SKIP_ENV_VALIDATION: "1"
        run: pnpm build

  # =========================================================================
  # Web integration — real Postgres, real Prisma. Proves tenant
  # isolation at the SQL boundary (brief §10.3 / ADR-0002 / P7 L3).
  # Separate job so the fast unit `web` job stays infra-free.
  # =========================================================================
  web-integration:
    name: web · integration (real postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verbio
          POSTGRES_PASSWORD: verbio
          POSTGRES_DB: verbio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verbio -d verbio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://verbio:verbio@localhost:5432/verbio
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: "services/engine/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install engine deps (for alembic)
        working-directory: services/engine
        run: uv sync --frozen

      - name: Apply Alembic migrations
        working-directory: services/engine
        env:
          DATABASE_URL_DIRECT: postgresql+asyncpg://verbio:verbio@localhost:5432/verbio
        run: uv run alembic upgrade head

      - name: Integration tests (vitest, real DB)
        working-directory: apps/web
        run: pnpm test:integration

  # =========================================================================
  # Engine — Python 3.12 + uv + ruff + mypy --strict + pytest
  # =========================================================================
  engine:
    name: engine · ruff • mypy • pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: "services/engine/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (mypy --strict)
        run: uv run mypy --strict verbio_engine

      - name: Test (pytest + coverage)
        run: uv run pytest -v --cov=verbio_engine --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-coverage
          path: services/engine/coverage.xml
          retention-days: 7

  # =========================================================================
  # Shared types — verify Pydantic → JSON Schema → TS is current
  # =========================================================================
  shared-types:
    name: shared-types · generated TS up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "services/engine/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (engine)
        working-directory: services/engine
        run: uv sync --frozen

      - name: Regenerate shared types
        run: pnpm shared-types:generate

      - name: Verify generated TS is up to date
        run: |
          if [[ -n "$(git status --porcelain packages/shared-types/src/generated)" ]]; then
            echo "::error::Generated shared types are out of date."
            echo "Run 'pnpm shared-types:generate' locally and commit the diff."
            git --no-pager diff packages/shared-types/src/generated
            exit 1
          fi
          echo "✅ Generated shared types are in sync with schemas."

  # =========================================================================
  # Format — Prettier check across the repo
  # =========================================================================
  format:
    name: format · prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # =========================================================================
  # Commit lint — Conventional Commits, PRs only
  # =========================================================================
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR commits
        run: pnpm commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  # =========================================================================
  # Status — single check that downstream branch protection can require
  # =========================================================================
  status:
    name: ci status
    runs-on: ubuntu-latest
    needs: [web, web-integration, engine, shared-types, format]
    if: always()
    steps:
      - name: Aggregate
        run: |
          if [[ "${{ needs.web.result }}" != "success" ]] || \
             [[ "${{ needs.web-integration.result }}" != "success" ]] || \
             [[ "${{ needs.engine.result }}" != "success" ]] || \
             [[ "${{ needs.shared-types.result }}" != "success" ]] || \
             [[ "${{ needs.format.result }}" != "success" ]]; then
            echo "❌ One or more required CI jobs failed."
            exit 1
          fi
          echo "✅ All required CI jobs passed."
